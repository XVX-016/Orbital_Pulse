server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip settings for performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cesium static assets — serve directly, NEVER fall back to index.html.
    # Cesium parses JSON/binary files; returning index.html causes a fatal crash.
    location /cesiumStatic/ {
        try_files $uri =404;
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # SPA: all other routes fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache fingerprinted static assets (JS/CSS bundles, images, fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|wasm|glb|gltf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
