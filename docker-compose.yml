services:
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_AI_SERVICE_URL=http://localhost:8082
    ports:
      - "5173:5173"
    networks:
      - satquery-net
    depends_on:
      satquery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  satquery-service:
    build:
      context: ./satquery-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    volumes:
      - huggingface-cache:/app/.cache/huggingface
      - ./satquery-service/raw_data:/app/raw_data:ro
      - ai-data:/app/data
      - ai-previews:/app/public/images
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - satquery-net
    command: >
      sh -c "
        echo '=== SatQuery AI Agentic Service Startup ===' &&
        python scripts/prepare_data.py || echo 'prepare_data.py skipped/exited.' &&
        uvicorn main:app --host 0.0.0.0 --port 8082
      "
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8082/health')\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: orbital_user
      POSTGRES_PASSWORD: orbital_password
      POSTGRES_DB: orbital_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs automatically on first container start (only when pgdata volume is empty)
      - ./satquery-service/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - satquery-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbital_user -d orbital_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  satquery-net:
    driver: bridge

volumes:
  pgdata:
  huggingface-cache:
  ai-data:
  ai-previews:
